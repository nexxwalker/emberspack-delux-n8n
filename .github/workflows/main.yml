# Delux crew — the pipeline. Every push and every pull request against `main`
# runs the quality gate; a push to `main` that passes it all deploys the static
# frontend to Vercel.
#
# Required GitHub secrets for the deploy job (Settings → Secrets and variables
# → Actions). Without them the deploy job notices and skips, it does not fail:
#   VERCEL_TOKEN       Vercel access token
#   VERCEL_ORG_ID      from `vercel link` → .vercel/project.json
#   VERCEL_PROJECT_ID  from `vercel link` → .vercel/project.json

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing a workflow does here needs write access to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never commits, so skip installing the local git hooks.
  HUSKY: '0'
  # Keep npm quiet and deterministic in logs.
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  # ---------------------------------------------------------------------
  # Quality gate, on every Node version the package declares support for.
  # ---------------------------------------------------------------------
  quality:
    name: quality · node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # engines.node is ">=20": the floor, the LTS line, and current.
        node-version: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      - name: Formatting gate
        run: npm run format:check

      - name: Lint gate
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build the office bundle
        run: npm run build

  # ---------------------------------------------------------------------
  # The 35-step build loop: bundle, roster, skills, routines, then the live
  # server and a headless-browser smoke test. Node 20 only — it is the
  # declared floor, so if it passes there it passes everywhere above it.
  # ---------------------------------------------------------------------
  smoke:
    name: build loop · npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      # check.mjs drives the built office in a real headless browser. Install
      # it from the *local* playwright-core so the build number matches the
      # installed package (plain `npx playwright install` fetches a newer CLI
      # and downloads a browser the package cannot launch).
      - name: Install the headless browser for the smoke test
        run: npx --no-install playwright-core install --with-deps chromium

      - name: Build loop
        run: npm run check

  # ---------------------------------------------------------------------
  # Deploy. Runs only after both gates pass, and only on a push to main.
  # ---------------------------------------------------------------------
  deploy:
    name: deploy · vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      - name: Check for Vercel credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not set — skipping the Vercel deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to enable it."
          fi

      - name: Build the static frontend
        if: steps.creds.outputs.configured == 'true'
        run: npm run build:vercel

      - name: Deploy to Vercel
        if: steps.creds.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # Pinned: CI must not silently pull a different CLI major than this
        # pipeline was written against. Bump it deliberately.
        run: npx --yes vercel@65.4.0 deploy --prod --yes --token="$VERCEL_TOKEN"
